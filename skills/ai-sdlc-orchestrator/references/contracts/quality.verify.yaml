id: quality.verify
version: 1
dispatch:
  required_inputs: [implementation, review]
  optional_inputs: [acceptance_criteria]
  task_template: references/prompts/quality-verify.md
  readable_scope: [src, tests, docs, staging]
  writable_scope: [staging]
  forbidden_actions: [canonical_state_write]
result:
  required_sections: [verification, result, evidence]
  allowed_formats: [markdown, yaml, json]
  required_evidence: [tests, review, security, build]
  expected_artifacts: [test-report]
  statuses: [completed, partial, blocked, failed]
  open_questions: []
integration:
  mappings: [test-report]
  structural_checks: [scope, completed-execution]
  semantic_checks: [acceptance-criteria]
  human_approvals: []
  acceptance: [verification-passed]
  partial_result_policy: reject
  retry_policy: replace_provider
parallelism:
  allowed: never
  partition_by: []
  integration_capability: provider-result.integrate
missing_provider_policy: stop
