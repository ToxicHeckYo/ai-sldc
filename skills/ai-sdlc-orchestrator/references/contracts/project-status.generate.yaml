id: project-status.generate
version: 1
dispatch:
  required_inputs: [project_snapshot]
  optional_inputs: []
  task_template: references/prompts/project-status-generate.md
  readable_scope: [docs/project-control]
  writable_scope: [staging]
  forbidden_actions: [canonical_state_write]
result:
  required_sections: [status, current_stage, focus, next_actions]
  allowed_formats: [markdown]
  required_evidence: [snapshot-hash]
  expected_artifacts: [PROJECT_STATUS.md]
  statuses: [completed, partial, blocked, failed]
  open_questions: []
integration:
  mappings: [PROJECT_STATUS.md]
  structural_checks: [schema]
  semantic_checks: [snapshot-consistency]
  human_approvals: []
  acceptance: [deterministic-output]
  partial_result_policy: reject
  retry_policy: same_provider
parallelism:
  allowed: never
  partition_by: []
  integration_capability: provider-result.integrate
missing_provider_policy: stop
