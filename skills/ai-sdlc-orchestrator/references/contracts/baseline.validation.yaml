id: baseline.validation
version: 1
dispatch:
  required_inputs: [project_snapshot]
  optional_inputs: [baseline_id]
  task_template: references/prompts/baseline-validation.md
  readable_scope: [docs]
  writable_scope: [staging]
  forbidden_actions: [canonical_state_write]
result:
  required_sections: [baseline, findings]
  allowed_formats: [yaml, json]
  required_evidence: [artifact-register, source-register]
  expected_artifacts: [baseline-validation-report]
  statuses: [completed, partial, blocked, failed]
  open_questions: []
integration:
  mappings: [baseline-validation-report]
  structural_checks: [schema, references]
  semantic_checks: [baseline-policy]
  human_approvals: []
  acceptance: [valid-baseline]
  partial_result_policy: require_human_decision
  retry_policy: same_provider
parallelism:
  allowed: never
  partition_by: []
  integration_capability: provider-result.integrate
missing_provider_policy: stop
