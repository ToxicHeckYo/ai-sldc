schema_version: 1
provider:
  id: superpowers-test-driven-development
  kind: external
  source: https://github.com/obra/superpowers
  revision: "7.0.1"
  integrity: sha256:7777777777777777777777777777777777777777777777777777777777777777
  evaluated_at: "2026-11-04"
  source_files: [{path: references/providers/adapters/implementation-tdd.yaml, url: https://example.invalid/ai-sdlc/implementation/implementation-tdd.yaml, git_blob: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, sha256: 7777777777777777777777777777777777777777777777777777777777777777}]
capability: {id: implementation.tdd, contract_version: 1}
raw_output_schema: references/providers/adapters/schemas/implementation-tdd-result.schema.json
dispatch: {task_template: references/prompts/implementation-tdd.md, readable_scope: [src, tests, docs], writable_scope: [staging], governance: {forbidden_actions: [canonical_state_write], protected_paths: [docs/project-control, docs/artifact-register.yaml, docs/product-definition/sources/source-register.yaml, PROJECT_STATUS.md]}}
result_mapping:
  status: {path: outcome, values: {complete: completed, partial: partial, blocked: blocked, failure: failed}}
  sections: {red: sections.red, green: sections.green, verification: sections.verification, work_item: sections.work_item}
  evidence:
    failing-test: {path: evidence.failing-test, type: string}
    passing-test: {path: evidence.passing-test, type: string}
    traceability: {path: evidence.traceability, type: array, item_required_fields: [source, target, relation]}
  files_path: files
  produced_path: produced
  unresolved_path: unresolved
  forbidden_nonempty_paths: [lifecycle_changes, project_state_changes, control_file_changes]
