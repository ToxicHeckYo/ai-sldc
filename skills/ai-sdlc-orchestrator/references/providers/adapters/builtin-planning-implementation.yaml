schema_version: 1
provider:
  id: builtin-planning-implementation
  kind: builtin
  source: builtin://planning-implementation
  revision: "1"
  integrity: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  evaluated_at: "2026-11-04"
  source_files: [{path: references/providers/adapters/builtin-planning-implementation.yaml, url: https://example.invalid/ai-sdlc/implementation/planning, git_blob: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}]
capability: {id: planning.implementation, contract_version: 1}
raw_output_schema: references/providers/adapters/schemas/implementation-plan-result.schema.json
dispatch: {task_template: references/prompts/planning-implementation.md, readable_scope: [docs], writable_scope: [staging], governance: {forbidden_actions: [canonical_state_write], protected_paths: [docs/project-control, docs/artifact-register.yaml, docs/product-definition/sources/source-register.yaml, PROJECT_STATUS.md]}}
result_mapping:
  status: {path: outcome, values: {complete: completed, partial: partial, blocked: blocked, failure: failed}}
  sections: {tasks: sections.tasks, dependencies: sections.dependencies, verification: sections.verification, work_item: sections.work_item}
  evidence:
    design: {path: evidence.design, type: string}
    requirements: {path: evidence.requirements, type: string}
    traceability: {path: evidence.traceability, type: array, item_required_fields: [source, target, relation]}
  files_path: files
  produced_path: produced
  unresolved_path: unresolved
  forbidden_nonempty_paths: [lifecycle_changes, project_state_changes, control_file_changes]
